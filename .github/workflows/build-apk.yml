name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEP: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
    - name: Build Next.js app
      run: |
        # Install dependencies
        npm ci --legacy-peer-deps
        
        # Fix baseline-browser-mapping
        npm install baseline-browser-mapping@latest -D
        
        # Create minimal API routes for build
        mkdir -p pages/api
        
        # Create a simple API route file using echo instead of cat with heredoc
        echo "import type { NextApiRequest, NextApiResponse } from 'next'
        export default async function handler(req: NextApiRequest, res: NextApiResponse) {
          return res.status(200).json({ status: 'ok', message: 'Build placeholder' })
        }" > pages/api/health.ts
        
        # Create next.config.js for static export using echo
        echo "/** @type {import('next').NextConfig} */
        const nextConfig = {
          output: 'export',
          images: { unoptimized: true },
          typescript: { ignoreBuildErrors: true },
          eslint: { ignoreDuringBuilds: true }
        };
        module.exports = nextConfig;" > next.config.js
        
        # Build the app
        npx next build
        
    - name: Verify build output
      run: |
        echo "Checking build output:"
        if [ -d ".next" ]; then
          echo "✅ .next directory exists"
        elif [ -d "out" ]; then
          echo "✅ out directory exists"
        else
          echo "❌ No build output found!"
          exit 1
        fi
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        
    - name: Install Android SDK 34
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmdline-tools;latest"
        
    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android
        
    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk