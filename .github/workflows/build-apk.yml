name: Build Android APK  # This stays - it's the workflow name

on:
  push:
    branches: [master]
  pull_request:
    branches: [ master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code  # This is fine - it's a step name
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20  # This is fine - it's a step name
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
    - name: Build Next.js app
      run: |
        npm run build || (echo "Build completed with warnings" && exit 0)
        
    - name: Verify build output
      run: |
        echo "Checking build output:"
        if [ -d ".next" ]; then
          echo "✅ .next directory exists"
          ls -la .next/
        elif [ -d "dist" ]; then
          echo "✅ dist directory exists"
          ls -la dist/
        else
          echo "❌ No build output found!"
          exit 1
        fi
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        
    - name: Install Android SDK 34 (more stable than 35)
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmdline-tools;latest"
        
    - name: Clean and setup Android project
      run: |
        # Remove existing android folder for clean setup
        rm -rf android
        npx cap add android --no-deps
        npx cap sync android
        
    - name: Update AndroidManifest.xml for proper permissions
      run: |
        echo "🔧 Ensuring AndroidManifest.xml has internet permission..."
        cd android/app/src/main
        if ! grep -q "android.permission.INTERNET" AndroidManifest.xml; then
          sed -i '/<application/a\    <uses-permission android:name="android.permission.INTERNET" />' AndroidManifest.xml
          echo "✅ Added INTERNET permission"
        fi
        
        # Add camera permission if your app uses it
        sed -i '/<application/a\    <uses-permission android:name="android.permission.CAMERA" />' AndroidManifest.xml
        sed -i '/<application/a\    <uses-feature android:name="android.hardware.camera" android:required="false" />' AndroidManifest.xml
        
    - name: Fix build.gradle for Android 34
      run: |
        cd android/app
        # Update compileSdk and targetSdk to 34
        sed -i 's/compileSdk .*/compileSdk 34/g' build.gradle
        sed -i 's/targetSdk .*/targetSdk 34/g' build.gradle
        sed -i 's/minSdk .*/minSdk 22/g' build.gradle
        
        # Ensure proper packaging options
        echo "" >> build.gradle
        echo "android {" >> build.gradle
        echo "    packagingOptions {" >> build.gradle
        echo "        exclude 'META-INF/NOTICE.md'" >> build.gradle
        echo "        exclude 'META-INF/LICENSE.md'" >> build.gradle
        echo "        exclude 'META-INF/INDEX.LIST'" >> build.gradle
        echo "    }" >> build.gradle
        echo "}" >> build.gradle
        
        echo "✅ Updated build.gradle"
        
    - name: Create debug keystore with proper permissions
      run: |
        mkdir -p android/app
        cd android/app
        keytool -genkeypair \
          -v \
          -keystore debug.keystore \
          -dname "CN=Android Debug, O=RubGo, C=ZA" \
          -storepass android \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias androiddebugkey \
          -storetype JKS
        chmod 644 debug.keystore
        echo "✅ Debug keystore created"
        
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --stacktrace
        
    - name: Verify APK is valid
      run: |
        cd android/app/build/outputs/apk/debug
        APK_FILE=$(ls *.apk | head -1)
        echo "📦 APK File: $APK_FILE"
        
        # Check if APK is valid
        if [ -f "$APK_FILE" ]; then
          echo "✅ APK exists ($(du -h "$APK_FILE" | cut -f1))"
          
          # Verify it's a valid ZIP/APK
          if unzip -t "$APK_FILE" > /dev/null 2>&1; then
            echo "✅ APK is a valid ZIP file"
            
            # Check for critical Android files
            if unzip -l "$APK_FILE" | grep -q "AndroidManifest.xml"; then
              echo "✅ Contains AndroidManifest.xml"
            else
              echo "❌ Missing AndroidManifest.xml!"
              exit 1
            fi
            
            if unzip -l "$APK_FILE" | grep -q "classes.dex"; then
              echo "✅ Contains classes.dex"
            else
              echo "❌ Missing classes.dex!"
              exit 1
            fi
          else
            echo "❌ APK is corrupted or not a valid ZIP file!"
            exit 1
          fi
        else
          echo "❌ No APK file found!"
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: rubgo-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error