name: Build Android APK  # This stays - it's the workflow name

on:
  push:
    branches: [master]
  pull_request:
    branches: [ master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code  # This is fine - it's a step name
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20  # This is fine - it's a step name
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
   - name: Build Next.js app
  run: |
    # Install dependencies
    npm ci --legacy-peer-deps
    
    # Fix baseline-browser-mapping
    npm install baseline-browser-mapping@latest -D
    
    echo "Setting up Pages Router API routes..."
    
    # Create pages/api directory structure
    mkdir -p pages/api/bookings/[id]
    mkdir -p pages/api/payments
    mkdir -p pages/api/auth
    mkdir -p pages/api/verification
    
    # Create ALL API routes with proper Pages Router syntax
    # 1. Signup
    cat > pages/api/signup.ts << 'EOL'
import type { NextApiRequest, NextApiResponse } from 'next'

export default async function handler(req: NextApiRequest, res: NextApiResponse) {
  if (req.method === 'POST') {
    try {
      const { email, password } = req.body
      
      if (!email || !password) {
        return res.status(400).json({ error: 'Email and password required' })
      }
      
      return res.status(201).json({
        success: true,
        message: 'Signup endpoint ready',
        user: { 
          id: 'temp-id-' + Date.now(), 
          email, 
          name: email.split('@')[0] 
        }
      })
    } catch (error) {
      return res.status(500).json({ error: 'Internal server error' })
    }
  }
  
  return res.status(405).json({ error: 'Method not allowed' })
}
EOL

    # 2. Bookings - arrival instructions
    cat > pages/api/bookings/[id]/arrival-instructions.ts << 'EOL'
import type { NextApiRequest, NextApiResponse } from 'next'

export default async function handler(req: NextApiRequest, res: NextApiResponse) {
  const { id } = req.query
  
  if (req.method === 'GET') {
    try {
      return res.status(200).json({
        id,
        arrivalInstructions: {
          buildingType: 'house',
          address: '123 Main St',
          unitNumber: '',
          floorNumber: '',
          gateCode: '',
          parkingInstructions: '',
          entryInstructions: '',
          specialNotes: '',
          shareWithTherapist: true
        },
        message: 'API endpoint ready'
      })
    } catch (error) {
      return res.status(500).json({ error: 'Internal server error' })
    }
  }
  
  if (req.method === 'PUT') {
    try {
      const data = req.body
      return res.status(200).json({
        success: true,
        message: 'Arrival instructions updated',
        id,
        data
      })
    } catch (error) {
      return res.status(500).json({ error: 'Internal server error' })
    }
  }
  
  return res.status(405).json({ error: 'Method not allowed' })
}
EOL

    # 3. Bookings - main endpoint
    cat > pages/api/bookings/[id]/index.ts << 'EOL'
