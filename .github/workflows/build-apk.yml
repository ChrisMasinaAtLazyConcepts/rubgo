name: Build Android APK

on:
  push:
    branches: []
  pull_request:
    branches: []
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEP: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
    - name: Build Next.js app
      run: |
        # 1. Ensure a clean, correct build
        npm ci --legacy-peer-deps
        npx next build
        
        # 2. Verify the build output exists where Capacitor expects it
        if [ -f "out/index.html" ]; then
          echo "✅ Build found in 'out/' directory (Next.js default for 'output: export')"
        elif [ -f "dist/index.html" ]; then
          echo "✅ Build found in 'dist/' directory"
        else
          echo "❌ ERROR: No index.html found. Listing build directory:"
          ls -la .next/ 2>/dev/null || ls -la
          exit 1
        fi

    - name: Prepare Capacitor Android
      run: |
        # Remove old platforms to ensure clean sync
        rm -rf android ios

        # Set the iOS deployment target BEFORE creating the platform
        # This is the crucial fix for the Podfile error
        npx cap config set ios.minVersion 15.0

        # Sync to generate platforms with the correct settings
        npx cap sync

        # Explicitly add the Android platform
        npx cap add android

    # === ADD THIS NEW STEP HERE ===
    - name: Fix iOS Deployment Target for Pods
      run: |
        # Create or update the ios/App/Podfile to set a modern iOS version
        # This prevents the "higher minimum deployment target" error
        if [ -f "ios/App/Podfile" ]; then
          echo "Updating existing Podfile deployment target..."
          # This command finds the 'platform :ios' line and updates the version
          sed -i.bak "s/platform :ios, '.*'/platform :ios, '15.0'/g" ios/App/Podfile
          echo "✅ Podfile updated to target iOS 15.0"
        else
          echo "ℹ️ Podfile not found, it will be created by Capacitor later."
        fi
    # ==============================
        
    - name: Setup Java 21 for Android  # REPLACED Java 17 with Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        
    - name: Install Android SDK 34
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmdline-tools;latest"
    
    - name: Build Android APK
      run: |
        # Verify Java version (diagnostic step)
        java -version
        # Clean and build with the correct Java
        cd android
        ./gradlew clean assembleDebug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk