name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEP: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            
    - name: Build Next.js app
      run: |
        # 1. Ensure a clean, correct build
        npm ci --legacy-peer-deps
        npx next build
        
        # 2. Verify the build output exists where Capacitor expects it
        if [ -f "out/index.html" ]; then
          echo "✅ Build found in 'out/' directory (Next.js default for 'output: export')"
        elif [ -f "dist/index.html" ]; then
          echo "✅ Build found in 'dist/' directory"
        else
          echo "❌ ERROR: No index.html found. Listing build directory:"
          ls -la .next/ 2>/dev/null || ls -la
          exit 1
        fi

    - name: Prepare Capacitor Android
      run: |
        # 3. Remove existing Android platform to allow clean re-add
        rm -rf android
        
        # 4. Ensure the webDir in capacitor.config.ts points to the correct folder
        # If your Next.js outputs to 'out', update it. If 'dist', ensure it exists.
        # Let's check and sync
        npx cap sync
        
        # 5. Explicitly add the Android platform
        npx cap add android
        
    - name: Verify build output
      run: |
        echo "Checking build output:"
        if [ -d ".next" ]; then
          echo "✅ .next directory exists"
        elif [ -d "out" ]; then
          echo "✅ out directory exists"
        else
          echo "❌ No build output found!"
          exit 1
        fi
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
        
    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        
    - name: Install Android SDK 34
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmdline-tools;latest"
        
    - name: Setup Capacitor Android
      run: |
        npx cap add android || true
        npx cap sync android
        
    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk