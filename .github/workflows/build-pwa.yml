name: Build and Deploy React PWA
on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows manual trigger

# Sets permissions for the deployment job
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Use a version compatible with your project

      - name: Install Dependencies
        run: npm ci # Uses package-lock.json for exact versions

      - name: Build with Next.js (Static Export)
        run: npm run build
        # CRITICAL: Ensure `next.config.js` is configured for static export
        # Example config: `output: 'export'` and `basePath: '/rubgo'`

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: out # The default Next.js static export folder
          clean: true # Remove old files from gh-pages branch
