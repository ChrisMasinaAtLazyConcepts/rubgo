name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [off]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm run build
        
    - name: Setup iOS
      run: |
        # Clean and setup fresh iOS project
        rm -rf ios
        npx cap add ios
        npx cap sync ios
        
        # Install CocoaPods
        cd ios/App
        pod install --repo-update
        
    - name: Fix Xcode Project Signing
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🔧 Setting Team ID: $TEAM_ID"
        
        # NUCLEAR OPTION: Completely rebuild Xcode project with correct signing
        # 1. Create a Python script to properly modify the project
        cat > fix_project.py << 'EOF'
        import re
        import os
        
        team_id = os.environ.get('TEAM_ID', '')
        
        if not team_id:
            print("❌ ERROR: TEAM_ID not set")
            exit(1)
            
        project_file = 'App.xcodeproj/project.pbxproj'
        
        with open(project_file, 'r') as f:
            content = f.read()
        
        # Pattern 1: Replace empty DEVELOPMENT_TEAM
        content = re.sub(r'DEVELOPMENT_TEAM = "";', f'DEVELOPMENT_TEAM = "{team_id}";', content)
        
        # Pattern 2: Add DEVELOPMENT_TEAM if missing in build settings
        if 'DEVELOPMENT_TEAM = ' not in content:
            # Find Build Settings section and add it
            content = re.sub(
                r'(Build Settings = \{)(.*?)(\};)',
                r'\1\n\t\t\t\tDEVELOPMENT_TEAM = "' + team_id + '";\2\3',
                content,
                flags=re.DOTALL
            )
        
        # Write back
        with open(project_file, 'w') as f:
            f.write(content)
            
        print(f"✅ Updated project with TEAM_ID: {team_id}")
        EOF
        
        # 2. Run the fix
        python3 fix_project.py
        
        # 3. VERIFY the change
        echo "📋 Verification:"
        grep -n "DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj || echo "ERROR: DEVELOPMENT_TEAM not found"
        
    - name: Build IPA (NO FASTLANE)
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🚀 Building IPA directly with xcodebuild..."
        
        # 1. Clean
        rm -rf build
        mkdir -p build
        
        # 2. CREATE EXPORT OPTIONS
        cat > exportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
        </dict>
        </plist>
        EOF
        
        # 3. ARCHIVE (SIMPLIFIED - let Xcode handle signing)
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          CODE_SIGN_STYLE="Automatic" \
          DEVELOPMENT_TEAM="$TEAM_ID" \
          | xcpretty
        
        # 4. EXPORT
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates \
          | xcpretty
        
        # 5. CHECK RESULTS
        if [ -f "build/App.ipa" ]; then
          echo "✅ SUCCESS! IPA file created:"
          ls -lh build/App.ipa
        else
          echo "❌ FAILED: No IPA created"
          echo "Looking for any IPA files:"
          find . -name "*.ipa" -type f 2>/dev/null || echo "No IPA files found"
          exit 1
        fi
        
    - name: Upload to TestFlight
      if: success()
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        cd ios/App
        
        echo "📤 Uploading to TestFlight..."
        
        # Install xcrun tools if needed
        xcode-select -p || sudo xcode-select -s /Applications/Xcode.app
        
        # Upload using altool (works with app-specific password)
        xcrun altool --upload-app \
          -f build/App.ipa \
          -t ios \
          -u "$APPLE_ID" \
          -p "$APPLE_APP_SPECIFIC_PASSWORD" \
          --verbose
        
        echo "✅ Upload complete!"