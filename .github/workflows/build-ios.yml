name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        echo "🚀 Building Next.js app..."
        
        # Create next.config.js with static export
        echo 'module.exports = {' > next.config.js
        echo '  output: "export",' >> next.config.js
        echo '  trailingSlash: true,' >> next.config.js
        echo '  images: { unoptimized: true },' >> next.config.js
        echo '  reactStrictMode: false,' >> next.config.js
        echo '  typescript: { ignoreBuildErrors: true },' >> next.config.js
        echo '  eslint: { ignoreDuringBuilds: true },' >> next.config.js
        echo '}' >> next.config.js
        
        npm run build
        
        # Verify build
        if [ -f "out/index.html" ] || [ -f "dist/index.html" ]; then
          echo "✅ Next.js build successful"
          if [ -f "out/index.html" ]; then
            mkdir -p dist
            cp -r out/* dist/
          fi
        else
          echo "❌ Next.js build failed"
          exit 1
        fi
        
    - name: Setup iOS platform
      run: |
        # Clean up previous iOS platform
        rm -rf ios
        
        # Add iOS platform
        npx cap add ios
        
        # Configure iOS minimum version
        npx cap config set ios.minVersion 15.0
        
        # Sync web assets
        npx cap sync ios
        
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install --repo-update
        
    - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🔧 FIXING CODE SIGNING ONCE AND FOR ALL..."
        
        # METHOD 1: Use xcodebuild commands to set signing
        echo "⚙️ Method 1: Using xcodebuild with explicit parameters..."
        
        # Clean
        rm -rf build
        mkdir -p build
        
        # Build archive - THE KEY FIX: Use xcodebuild with -xcconfig
        echo "🏗️ Building archive with development team..."
        
        # Create a temporary config file with the team ID
        cat > build.xcconfig << EOF
DEVELOPMENT_TEAM = $DEVELOPER_TEAM_ID
CODE_SIGN_STYLE = Automatic
PROVISIONING_PROFILE_SPECIFIER = 
EOF
        
        # Build with the config file
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          -xcconfig build.xcconfig
        
        # Check if archive was created
        if [ ! -d "build/App.xcarchive" ]; then
          echo "⚠️ Method 1 failed, trying Method 2..."
          
          # METHOD 2: Use xcrun to set signing
          echo "⚙️ Method 2: Using xcrun to update project..."
          
          # Update the project with xcrun
          /usr/libexec/PlistBuddy -c "Set :objects:8C4830BB246B8D1600170895:buildSettings:DEVELOPMENT_TEAM $DEVELOPER_TEAM_ID" App.xcodeproj/project.pbxproj 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :objects:8C4830BB246B8D1600170895:buildSettings:CODE_SIGN_STYLE Automatic" App.xcodeproj/project.pbxproj 2>/dev/null || true
          
          # Try building again
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates
        fi
        
        if [ ! -d "build/App.xcarchive" ]; then
          echo "⚠️ Method 2 failed, trying Method 3 (last resort)..."
          
          # METHOD 3: Build without archive and create IPA manually
          echo "⚙️ Method 3: Building app directly..."
          
          # Build the .app file
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic
            
          # Find the .app file
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          
          if [ -n "$APP_PATH" ]; then
            echo "✅ Found .app file: $APP_PATH"
            
            # Create IPA manually
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -qr build/App.ipa Payload
            rm -rf Payload
            
            echo "✅ Created IPA manually"
            ls -lh build/App.ipa
            
            # Skip to upload
            echo "🎉 IPA created (manual method)"
            exit 0
          fi
        fi
        
        if [ ! -d "build/App.xcarchive" ]; then
          echo "❌ All methods failed"
          echo "📁 Current directory: $(pwd)"
          echo "📁 Files:"
          ls -la
          exit 1
        fi
        
        echo "✅ Archive created successfully"
        
        # Create export options
        echo "📦 Creating export options..."
        cat > exportOptions.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>teamID</key>
    <string>$DEVELOPER_TEAM_ID</string>
    <key>signingStyle</key>
    <string>automatic</string>
</dict>
</plist>
EOF
        
        # Export IPA
        echo "📤 Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates
        
        # Verify IPA
        if [ -f "build/App.ipa" ]; then
          echo "✅ IPA created: build/App.ipa"
          ls -lh build/App.ipa
        else
          echo "⚠️ IPA not found, checking for alternatives..."
          
          # Look for any IPA
          FOUND_IPA=$(find . -name "*.ipa" -type f | head -1)
          if [ -n "$FOUND_IPA" ]; then
            echo "✅ Found IPA: $FOUND_IPA"
            cp "$FOUND_IPA" build/App.ipa
            ls -lh build/App.ipa
          elif [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "📦 Creating IPA from .app file..."
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/
            zip -qr build/App.ipa Payload
            rm -rf Payload
            echo "✅ Created IPA from .app"
            ls -lh build/App.ipa
          else
            echo "❌ No IPA created"
            exit 1
          fi
        fi
        
        echo "🎉 Build completed successfully!"
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/App.ipa
        retention-days: 7
  
  upload-to-testflight:
    runs-on: ubuntu-latest
    needs: build-ios
    
    steps:
    - name: Download IPA artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-ipa
        
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        
    - name: Install Fastlane
      run: gem install fastlane -N
        
    - name: Verify IPA exists
      run: |
        echo "📦 Looking for IPA..."
        find . -name "*.ipa" -type f
        
        # Move IPA to root
        if [ -f "App.ipa" ]; then
          echo "✅ Found App.ipa"
        else
          # Download artifact puts it in current directory
          mv *.ipa App.ipa 2>/dev/null || true
          if [ -f "App.ipa" ]; then
            echo "✅ Renamed IPA to App.ipa"
          else
            echo "❌ No IPA found!"
            exit 1
          fi
        fi
        
    - name: Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        fastlane pilot upload \
          --ipa "App.ipa" \
          --username "$APPLE_ID" \
          --app_identifier "za.co.rubhub.yourapp" \
          --skip_waiting_for_build_processing true