name: Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  upload-ios:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        
    - name: Install Fastlane
      run: gem install fastlane -N
        
    - name: Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        # Change this to your actual IPA path
        IPA_PATH="ios/build/App.ipa"
        
        if [ ! -f "$IPA_PATH" ]; then
          echo "❌ IPA not found at: $IPA_PATH"
          echo "Searching for IPA files..."
          find . -name "*.ipa" -type f
          exit 1
        fi
        
        echo "📦 Uploading IPA: $IPA_PATH"
        fastlane pilot upload \
          --ipa "$IPA_PATH" \
          --username "$APPLE_ID" \
          --app_identifier "za.co.rubhub.yourapp"