    - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🔧 FIXING CODE SIGNING ISSUE..."
        
        # 1. FIRST, properly update the Xcode project file
        echo "⚙️ Updating Xcode project with development team..."
        
        # Backup the project file
        cp App.xcodeproj/project.pbxproj App.xcodeproj/project.pbxproj.backup
        
        # Use Python to properly parse and update the project file (more reliable)
        cat > fix_signing.py << 'PYTHON_EOF'
import plistlib
import re
import sys

# Read the project.pbxproj file
with open('App.xcodeproj/project.pbxproj', 'r') as f:
    content = f.read()

# Development team ID from environment
team_id = sys.argv[1]

# Find and replace DEVELOPMENT_TEAM
# Pattern: DEVELOPMENT_TEAM = "";
content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*"";', f'DEVELOPMENT_TEAM = "{team_id}";', content)

# Set CODE_SIGN_STYLE to Automatic
content = re.sub(r'CODE_SIGN_STYLE\s*=\s*".*?";', 'CODE_SIGN_STYLE = "Automatic";', content)

# Set PROVISIONING_PROFILE_SPECIFIER to empty
content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*".*?";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)

# Write back
with open('App.xcodeproj/project.pbxproj', 'w') as f:
    f.write(content)

print("✅ Updated Xcode project with team ID:", team_id)
PYTHON_EOF
        
        # Run the Python script
        python3 fix_signing.py "$DEVELOPER_TEAM_ID"
        
        # Verify the changes
        echo "🔍 Verifying changes in project.pbxproj..."
        grep -n "DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj | head -5
        grep -n "CODE_SIGN_STYLE" App.xcodeproj/project.pbxproj | head -5
        
        # 2. Clean build folder
        echo "🧹 Cleaning build folder..."
        rm -rf build
        mkdir -p build
        
        # 3. Create export options
        echo "📦 Creating export options..."
        cat > exportOptions.plist << 'PLIST_EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>teamID</key>
    <string>$DEVELOPER_TEAM_ID</string>
    <key>signingStyle</key>
    <string>automatic</string>
    <key>compileBitcode</key>
    <false/>
</dict>
</plist>
PLIST_EOF
        
        # 4. Build archive WITH DEVELOPMENT_TEAM parameter
        echo "🏗️ Building archive..."
        
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" \
          CODE_SIGN_STYLE="Automatic" \
          PROVISIONING_PROFILE_SPECIFIER=""
        
        # Check result
        if [ $? -eq 0 ] && [ -d "build/App.xcarchive" ]; then
          echo "✅ Archive created successfully!"
        else
          echo "⚠️ Archive may have warnings, checking if .xcarchive exists..."
          if [ -d "build/App.xcarchive" ]; then
            echo "✅ .xcarchive exists despite warnings"
          else
            echo "❌ Archive failed completely"
            echo "📁 Build folder contents:"
            ls -la build/
            exit 1
          fi
        fi
        
        # 5. Export IPA
        echo "📤 Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates
        
        # 6. Check for IPA
        echo "🔍 Looking for IPA..."
        
        if [ -f "build/App.ipa" ]; then
          echo "✅ IPA created: build/App.ipa"
          ls -lh build/App.ipa
        else
          echo "⚠️ IPA not in expected location, searching..."
          
          # Search for any .ipa file
          IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
          if [ -n "$IPA_FILE" ]; then
            echo "✅ Found IPA: $IPA_FILE"
            # Move to standard location
            cp "$IPA_FILE" build/App.ipa
            ls -lh build/App.ipa
          else
            echo "❌ No IPA found, creating manually from .app..."
            
            if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
              echo "📦 Creating IPA from .app file..."
              mkdir -p Payload
              cp -r build/App.xcarchive/Products/Applications/App.app Payload/
              zip -qr build/App.ipa Payload
              rm -rf Payload
              echo "✅ Manual IPA created: build/App.ipa"
              ls -lh build/App.ipa
            else
              echo "❌ Build failed - no .app file found"
              echo "📁 Build folder:"
              ls -la build/
              exit 1
            fi
          fi
        fi
        
        echo "🎉 Build completed successfully!"