name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        echo "🚀 Building Next.js app..."
        
        # Create next.config.js with static export
        echo 'module.exports = {' > next.config.js
        echo '  output: "export",' >> next.config.js
        echo '  trailingSlash: true,' >> next.config.js
        echo '  images: { unoptimized: true },' >> next.config.js
        echo '  reactStrictMode: false,' >> next.config.js
        echo '  typescript: { ignoreBuildErrors: true },' >> next.config.js
        echo '  eslint: { ignoreDuringBuilds: true },' >> next.config.js
        echo '}' >> next.config.js
        
        npm run build
        
        # Verify build
        if [ -f "out/index.html" ] || [ -f "dist/index.html" ]; then
          echo "✅ Next.js build successful"
          if [ -f "out/index.html" ]; then
            mkdir -p dist
            cp -r out/* dist/
          fi
        else
          echo "❌ Next.js build failed"
          exit 1
        fi
        
    - name: Setup iOS platform
      run: |
        # Clean up previous iOS platform
        rm -rf ios
        
        # Add iOS platform
        npx cap add ios
        
        # Configure iOS minimum version
        npx cap config set ios.minVersion 15.0
        
        # Sync web assets
        npx cap sync ios
        
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install --repo-update
        
    - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        cd ios/App
        
        echo "🔧 Setting up code signing..."
        
        # 1. Configure Xcode project for automatic signing
        /usr/libexec/PlistBuddy -c "Set :objects:8C4830BB246B8D1600170895:buildSettings:DEVELOPMENT_TEAM $DEVELOPER_TEAM_ID" project.pbxproj
        /usr/libexec/PlistBuddy -c "Set :objects:8C4830BB246B8D1600170895:buildSettings:PROVISIONING_PROFILE_SPECIFIER ''" project.pbxproj
        /usr/libexec/PlistBuddy -c "Set :objects:8C4830BB246B8D1600170895:buildSettings:CODE_SIGN_STYLE Automatic" project.pbxproj
        
        # 2. Create a simple build script to handle signing
        cat > build_ipa.sh << 'BUILD_EOF'
        #!/bin/bash
        
        # Create export options
        cat > exportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$DEVELOPER_TEAM_ID</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
        </dict>
        </plist>
        EOF
        
        # Clean build folder
        rm -rf build
        
        # Archive with automatic signing
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcworkspace \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" \
          CODE_SIGN_STYLE="Automatic" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGN_IDENTITY="Apple Distribution"
        
        # Export IPA
        xcodebuild -exportArchive \
          -archivePath build/App.xcworkspace \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates
        BUILD_EOF
        
        chmod +x build_ipa.sh
        
        echo "🏗️ Building IPA with automatic signing..."
        ./build_ipa.sh
        
        # Check if IPA was created
        if [ -f "build/App.ipa" ]; then
          echo "✅ IPA created successfully!"
          ls -lh build/App.ipa
          
          # Also check for other possible IPA locations
          echo "📁 Build folder contents:"
          find build -name "*.ipa" -type f
        else
          echo "❌ IPA not found in expected location"
          echo "📁 Searching for IPA files..."
          find . -name "*.ipa" -type f
          echo "📁 Build folder:"
          ls -la build/
          exit 1
        fi
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/App.ipa
        retention-days: 7
  
  upload-to-testflight:
    runs-on: ubuntu-latest
    needs: build-ios
    
    steps:
    - name: Download IPA artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-ipa
        
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        
    - name: Install Fastlane
      run: gem install fastlane -N
        
    - name: Verify IPA exists
      run: |
        echo "📦 Looking for IPA..."
        find . -name "*.ipa" -type f
        
        # Move IPA to root
        if [ -f "App.ipa" ]; then
          echo "✅ Found App.ipa"
        else
          # Download artifact puts it in current directory
          mv *.ipa App.ipa 2>/dev/null || true
          if [ -f "App.ipa" ]; then
            echo "✅ Renamed IPA to App.ipa"
          else
            echo "❌ No IPA found!"
            exit 1
          fi
        fi
        
    - name: Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        fastlane pilot upload \
          --ipa "App.ipa" \
          --username "$APPLE_ID" \
          --app_identifier "za.co.rubhub.yourapp" \
          --skip_waiting_for_build_processing true