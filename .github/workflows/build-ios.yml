name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        echo "🚀 Building Next.js app..."
        
        # Create next.config.js with static export
        echo 'module.exports = {' > next.config.js
        echo '  output: "export",' >> next.config.js
        echo '  trailingSlash: true,' >> next.config.js
        echo '  images: { unoptimized: true },' >> next.config.js
        echo '  reactStrictMode: false,' >> next.config.js
        echo '  typescript: { ignoreBuildErrors: true },' >> next.config.js
        echo '  eslint: { ignoreDuringBuilds: true },' >> next.config.js
        echo '}' >> next.config.js
        
        npm run build
        
        # Verify build
        if [ -f "out/index.html" ] || [ -f "dist/index.html" ]; then
          echo "✅ Next.js build successful"
          if [ -f "out/index.html" ]; then
            mkdir -p dist
            cp -r out/* dist/
          fi
        else
          echo "❌ Next.js build failed"
          exit 1
        fi
        
    - name: Setup iOS platform
      run: |
        # Clean up previous iOS platform
        rm -rf ios
        
        # Add iOS platform
        npx cap add ios
        
        # Configure iOS minimum version
        npx cap config set ios.minVersion 15.0
        
        # Sync web assets
        npx cap sync ios
        
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install --repo-update
        
       - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🔧 Setting up Xcode project for automatic signing..."
        
        # 1. FIRST, verify the Xcode project structure
        echo "📁 Checking Xcode project structure..."
        if [ -f "App.xcodeproj/project.pbxproj" ]; then
          echo "✅ Found project.pbxproj"
          # Backup the original
          cp App.xcodeproj/project.pbxproj App.xcodeproj/project.pbxproj.backup
        else
          echo "❌ project.pbxproj not found!"
          echo "📁 Current directory contents:"
          pwd
          ls -la
          echo "📁 App.xcodeproj contents:"
          ls -la App.xcodeproj/ 2>/dev/null || echo "No App.xcodeproj folder"
          exit 1
        fi
        
        # 2. Configure automatic signing using sed (simpler and more reliable)
        echo "⚙️ Configuring automatic signing..."
        
        # Enable automatic signing
        sed -i.bak 's/ProvisioningStyle = Manual;/ProvisioningStyle = Automatic;/g' App.xcodeproj/project.pbxproj
        
        # Set development team
        sed -i.bak "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = \"$DEVELOPER_TEAM_ID\";/g" App.xcodeproj/project.pbxproj
        
        # Set code signing identity
        sed -i.bak 's/CODE_SIGN_IDENTITY = "";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' App.xcodeproj/project.pbxproj
        sed -i.bak 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' App.xcodeproj/project.pbxproj
        
        echo "✅ Xcode project configured for automatic signing"
        
        # 3. Create export options
        echo "📦 Creating export options..."
        cat > exportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>compileBitcode</key>
    <false/>
    <key>destination</key>
    <string>export</string>
    <key>method</key>
    <string>app-store</string>
    <key>signingStyle</key>
    <string>automatic</string>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>teamID</key>
    <string>$DEVELOPER_TEAM_ID</string>
    <key>thinning</key>
    <string>&lt;none&gt;</string>
</dict>
</plist>
EOF
        
        echo "🧹 Cleaning previous builds..."
        # Clean any previous builds
        rm -rf build
        mkdir -p build
        
        # 4. Build archive with automatic signing
        echo "🏗️ Archiving app..."
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" \
          CODE_SIGN_STYLE="Automatic" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          -quiet
        
        # Check if archive was created
        if [ ! -d "build/App.xcarchive" ]; then
          echo "⚠️ Archive not created, trying alternative method..."
          
          # Try without specifying identity
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -quiet
        fi
        
        if [ ! -d "build/App.xcarchive" ]; then
          echo "❌ Archive creation failed"
          echo "📁 Build folder contents:"
          ls -la build/
          exit 1
        fi
        
        echo "✅ Archive created successfully"
        
        # 5. Export IPA
        echo "📤 Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates \
          -quiet
        
        # 6. Check for IPA in multiple possible locations
        echo "🔍 Looking for IPA file..."
        
        IPA_FOUND=false
        
        # Check common IPA locations
        if [ -f "build/App.ipa" ]; then
          echo "✅ IPA found: build/App.ipa"
          ls -lh build/App.ipa
          IPA_FOUND=true
        fi
        
        if [ -f "build/App.xcarchive/Products/Applications/App.app" ]; then
          echo "ℹ️ Found .app file, creating IPA manually..."
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr build/App.ipa Payload
          rm -rf Payload
          echo "✅ Created IPA manually: build/App.ipa"
          ls -lh build/App.ipa
          IPA_FOUND=true
        fi
        
        # Search for any .ipa file
        if [ "$IPA_FOUND" = false ]; then
          echo "🔎 Searching for any .ipa file..."
          FOUND_IPA=$(find . -name "*.ipa" -type f | head -1)
          if [ -n "$FOUND_IPA" ]; then
            echo "✅ Found IPA: $FOUND_IPA"
            # Copy to standard location
            cp "$FOUND_IPA" build/App.ipa
            ls -lh build/App.ipa
            IPA_FOUND=true
          fi
        fi
        
        if [ "$IPA_FOUND" = false ]; then
          echo "❌ No IPA file created!"
          echo "📁 Build folder contents:"
          ls -la build/
          echo "📁 Searching all files..."
          find . -name "*.ipa" -type f
          exit 1
        fi
        
        echo "🎉 IPA build completed successfully!"
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/App.ipa
        retention-days: 7
  
  upload-to-testflight:
    runs-on: ubuntu-latest
    needs: build-ios
    
    steps:
    - name: Download IPA artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-ipa
        
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        
    - name: Install Fastlane
      run: gem install fastlane -N
        
    - name: Verify IPA exists
      run: |
        echo "📦 Looking for IPA..."
        find . -name "*.ipa" -type f
        
        # Move IPA to root
        if [ -f "App.ipa" ]; then
          echo "✅ Found App.ipa"
        else
          # Download artifact puts it in current directory
          mv *.ipa App.ipa 2>/dev/null || true
          if [ -f "App.ipa" ]; then
            echo "✅ Renamed IPA to App.ipa"
          else
            echo "❌ No IPA found!"
            exit 1
          fi
        fi
        
    - name: Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        fastlane pilot upload \
          --ipa "App.ipa" \
          --username "$APPLE_ID" \
          --app_identifier "za.co.rubhub.yourapp" \
          --skip_waiting_for_build_processing true