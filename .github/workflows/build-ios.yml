name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        echo "🚀 Building Next.js app..."
        
        # Check Next.js config
        if ! grep -q "output.*export" next.config.js 2>/dev/null; then
          echo "⚠️ Adding output: 'export' to next.config.js"
          cat > next.config.js << 'EOF'
/** @type {import('next').NextConfig} */
const nextConfig = {
  output: 'export',
  trailingSlash: true,
  images: { unoptimized: true },
  reactStrictMode: false,
  typescript: { ignoreBuildErrors: true },
  eslint: { ignoreDuringBuilds: true },
}

module.exports = nextConfig
EOF
        fi
        
        npm run build
        
        # Verify build
        if [ -f "out/index.html" ] || [ -f "dist/index.html" ]; then
          echo "✅ Next.js build successful"
          # Ensure dist folder exists
          if [ -f "out/index.html" ]; then
            mkdir -p dist
            cp -r out/* dist/
            echo "📦 Copied build to dist/"
          fi
        else
          echo "❌ Next.js build failed"
          exit 1
        fi
        
    - name: Setup iOS platform (WITH DEBUG)
      run: |
        echo "📱 Setting up iOS platform..."
        
        # Remove old iOS platform
        rm -rf ios
        
        # List files before setup
        echo "📁 Files before adding iOS:"
        ls -la
        
        # Add iOS platform with verbose output
        npx cap add ios --verbose
        
        # Check if platform was created
        echo "📁 Files after adding iOS:"
        ls -la
        echo "📁 iOS folder contents:"
        ls -la ios/ 2>/dev/null || echo "No ios folder yet"
        
        # Configure iOS
        npx cap config set ios.minVersion 15.0
        npx cap config set ios.webDir dist
        
        echo "🔄 Syncing with iOS..."
        npx cap sync ios
        
        # Verify iOS platform structure
        echo "📁 Checking iOS structure:"
        if [ -d "ios/App" ]; then
          echo "✅ iOS App folder created"
          ls -la ios/App/
          
          # Check for workspace
          if [ -f "ios/App/App.xcworkspace" ]; then
            echo "✅ App.xcworkspace exists"
          else
            echo "⚠️ Creating App.xcworkspace"
            cd ios/App
            pod install
            cd ../..
          fi
        else
          echo "❌ iOS App folder not created"
          exit 1
        fi
        
    - name: Install CocoaPods
      run: |
        cd ios/App
        echo "📦 Installing CocoaPods..."
        pod install --repo-update
        
        # Verify workspace
        echo "📁 After pod install:"
        ls -la
        if [ -f "App.xcworkspace" ]; then
          echo "✅ App.xcworkspace exists"
        else
          echo "❌ App.xcworkspace not created!"
          exit 1
        fi
        
    - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🔍 Current directory:"
        pwd
        echo "📁 Files:"
        ls -la
        
        # Create export options
        cat > exportOptions.plist << EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>compileBitcode</key>
    <false/>
    <key>destination</key>
    <string>export</string>
    <key>method</key>
    <string>app-store</string>
    <key>signingStyle</key>
    <string>automatic</string>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>teamID</key>
    <string>$DEVELOPER_TEAM_ID</string>
</dict>
</plist>
EOF
        
        echo "🧹 Cleaning build..."
        xcodebuild clean -workspace App.xcworkspace -scheme App || echo "Clean failed, continuing..."
        
        echo "🏗️ Archiving app..."
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" || { echo "Archive failed"; exit 1; }
        
        echo "📦 Exporting IPA..."
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates || { echo "Export failed"; exit 1; }
        
        if [ -f "build/App.ipa" ]; then
          echo "✅ IPA created: build/App.ipa"
          ls -lh build/App.ipa
        else
          echo "❌ IPA creation failed"
          ls -la build/
          exit 1
        fi
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/App.ipa
        retention-days: 7