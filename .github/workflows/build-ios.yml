name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest  # iOS builds require macOS!
    outputs:
      ipa_path: ${{ steps.export_ipa.outputs.ipa_path }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        echo "🚀 Building Next.js app..."
        npm run build
        
        # Verify build
        if [ -f "dist/index.html" ] || [ -f "out/index.html" ]; then
          echo "✅ Next.js build successful"
        else
          echo "❌ Next.js build failed"
          exit 1
        fi
        
    - name: Setup iOS platform
      run: |
        # Clean up previous iOS platform
        rm -rf ios
        
        # Add iOS platform
        npx cap add ios
        
        # Configure iOS minimum version
        npx cap config set ios.minVersion 15.0
        
        # Sync web assets
        npx cap sync ios
        
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install --repo-update
        
    - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      run: |
        cd ios
        
        # Create export options plist
        cat > exportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$DEVELOPER_TEAM_ID</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
        </dict>
        </plist>
        EOF
        
        # Clean build
        xcodebuild clean -workspace App.xcworkspace -scheme App
        
        # Archive
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID"
        
        # Export IPA
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates
        
        # Verify IPA
        if [ -f "build/App.ipa" ]; then
          echo "✅ IPA created: build/App.ipa"
          ls -lh build/App.ipa
        else
          echo "❌ IPA creation failed"
          ls -la build/
          exit 1
        fi
        
    - name: Upload IPA artifact
      id: export_ipa
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/build/App.ipa
        retention-days: 7
      env:
        IPA_PATH: ios/build/App.ipa
  
  upload-to-testflight:
    runs-on: ubuntu-latest
    needs: build-ios
    
    steps:
    - name: Download IPA artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-ipa
        path: ./
        
    - name: Setup Fastlane
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Install Fastlane
      run: gem install fastlane -N
        
    - name: Verify IPA exists
      run: |
        echo "📦 Looking for IPA..."
        find . -name "*.ipa" -type f
        echo ""
        echo "📁 Current directory:"
        ls -la
        
        # Move IPA to root for easier access
        if [ -f "App.ipa" ]; then
          echo "✅ Found App.ipa"
        elif [ -f "ios-ipa/App.ipa" ]; then
          mv ios-ipa/App.ipa .
          echo "✅ Moved IPA to root"
        else
          echo "❌ No IPA found!"
          exit 1
        fi
        
    - name: Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        fastlane pilot upload \
          --ipa "App.ipa" \
          --username "$APPLE_ID" \
          --app_identifier "za.co.rubhub.yourapp" \
          --skip_waiting_for_build_processing true