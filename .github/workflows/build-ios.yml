name: Build iOS and Upload to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        echo "🚀 Building Next.js app..."
        
        # Create next.config.js with static export
        echo 'module.exports = {' > next.config.js
        echo '  output: "export",' >> next.config.js
        echo '  trailingSlash: true,' >> next.config.js
        echo '  images: { unoptimized: true },' >> next.config.js
        echo '  reactStrictMode: false,' >> next.config.js
        echo '  typescript: { ignoreBuildErrors: true },' >> next.config.js
        echo '  eslint: { ignoreDuringBuilds: true },' >> next.config.js
        echo '}' >> next.config.js
        
        npm run build
        
        # Verify build
        if [ -f "out/index.html" ] || [ -f "dist/index.html" ]; then
          echo "✅ Next.js build successful"
          if [ -f "out/index.html" ]; then
            mkdir -p dist
            cp -r out/* dist/
          fi
        else
          echo "❌ Next.js build failed"
          exit 1
        fi
        
    - name: Setup iOS platform
      run: |
        # Clean up previous iOS platform
        rm -rf ios
        
        # Add iOS platform
        npx cap add ios
        
        # Configure iOS minimum version
        npx cap config set ios.minVersion 15.0
        
        # Sync web assets
        npx cap sync ios
        
    - name: Install CocoaPods
      run: |
        cd ios/App
        pod install --repo-update
        
    - name: Build iOS IPA with Fastlane
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        cd ios/App
        
        echo "🔧 Using Fastlane for reliable build..."
        
        # Install fastlane
        gem install fastlane
        
        # Create a simple Fastfile
        mkdir -p fastlane
        cat > fastlane/Fastfile << 'EOF'
        default_platform(:ios)

        platform :ios do
          desc "Build iOS app"
          lane :build_ipa do
            # Build IPA
            gym(
              workspace: "App.xcworkspace",
              scheme: "App",
              export_method: "app-store",
              output_directory: "build",
              output_name: "App.ipa",
              clean: true,
              silent: true,
              export_options: {
                provisioningProfiles: {
                  ENV["BUNDLE_IDENTIFIER"] => ""
                },
                signingStyle: "automatic"
              }
            )
          end
        end
        EOF
        
        # Set environment variables
        export BUNDLE_IDENTIFIER="za.co.rubhub.yourapp"  # CHANGE THIS TO YOUR BUNDLE ID
        
        # Run fastlane
        fastlane ios build_ipa
        
        # Check result
        if [ -f "build/App.ipa" ]; then
          echo "✅ Fastlane created IPA: build/App.ipa"
          ls -lh build/App.ipa
        else
          echo "❌ Fastlane failed"
          exit 1
        fi
        
    - name: Upload to TestFlight
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        fastlane pilot upload \
          --ipa "App.ipa" \
          --username "$APPLE_ID" \
          --app_identifier "za.co.rubhub.yourapp" \
          --skip_waiting_for_build_processing true