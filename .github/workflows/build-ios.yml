name: Build iOS for TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]
env:
  NODE_VERSION: '20'
  NPM_LEGACY_PEER_DEPS: 'true'

jobs:
  build-ios:
    runs-on: macos-latest  # iOS builds require macOS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci --legacy-peer-deps
        npm install @capacitor/core @capacitor/cli @capacitor/ios --legacy-peer-deps
        
    - name: Build Next.js app
      run: |
        npm run build
        
        # Verify build output
        if [ -f "out/index.html" ]; then
          echo "Build found in 'out/' directory"
        elif [ -f "dist/index.html" ]; then
          echo "Build found in 'dist/' directory"
          # Ensure capacitor.config.ts points to dist
          if grep -q 'webDir.*dist' capacitor.config.* 2>/dev/null; then
            echo "Capacitor webDir correctly points to dist"
          else
            echo "Warning: Check capacitor.config.ts webDir setting"
          fi
        else
          echo "Error: No index.html found in build output"
          exit 1
        fi
        
    - name: Setup iOS platform
      run: |
        # Remove existing iOS platform if exists
        rm -rf ios
        
        # CRITICAL FIX: Set the minimum iOS version BEFORE adding the platform
        npx cap config set ios.minVersion 15.0
        
        # Add iOS platform (it will now use the version we just set)
        npx cap add ios
        
        # Sync web assets
        npx cap sync ios
        
    - name: Install CocoaPods dependencies
      run: |
        cd ios/App
        pod install
        
    - name: Setup iOS code signing
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        
        # Import certificate
        echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        
        # Import provisioning profile
        echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        uuid=$(grep -a -A 2 -F "<key>UUID</key>" profile.mobileprovision | grep -o "[-a-zA-Z0-9]\{36\}")
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision
        
        # Configure keychain settings
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        
    - name: Build iOS IPA
      env:
        APP_NAME: 'App'  # Change to your app name
        BUNDLE_IDENTIFIER: 'com.yourcompany.yourapp'  # Change to your bundle ID
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      run: |
        cd ios
        
        # Clean build folder
        xcodebuild clean -workspace App.xcworkspace -scheme App
        
        # Archive the app
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath $PWD/build/App.xcarchive \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM=$DEVELOPER_TEAM_ID \
          CODE_SIGN_STYLE=Manual \
          PROVISIONING_PROFILE_SPECIFIER='iOS Team Provisioning Profile: *'
        
        # Export IPA
        xcodebuild -exportArchive \
          -archivePath $PWD/build/App.xcarchive \
          -exportOptionsPlist $GITHUB_WORKSPACE/ios/exportOptions.plist \
          -exportPath $PWD/build \
          -allowProvisioningUpdates
        
        # Verify IPA was created
        if [ -f "$PWD/build/App.ipa" ]; then
          echo "✅ IPA created successfully"
          ls -lh $PWD/build/App.ipa
        else
          echo "❌ IPA creation failed"
          ls -la $PWD/build/
          exit 1
        fi
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/build/App.ipa
        retention-days: 7
        
    - name: Cleanup keychain (optional)
      if: always()
      run: |
        security delete-keychain build.keychain