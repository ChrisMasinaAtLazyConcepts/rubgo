    - name: Build iOS IPA
      env:
        DEVELOPER_TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
      run: |
        cd ios/App
        
        echo "🔧 Setting up Xcode project for automatic signing..."
        
        # 1. Configure signing using xcrun instead of sed
        echo "⚙️ Configuring code signing with xcrun..."
        
        # Clean build folder
        rm -rf build
        mkdir -p build
        
        # Create export options
        echo "📦 Creating export options..."
        cat > exportOptions.plist << 'EXPORT_EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>teamID</key>
    <string>$DEVELOPER_TEAM_ID</string>
    <key>signingStyle</key>
    <string>automatic</string>
</dict>
</plist>
EXPORT_EOF
        
        # 2. Try to build with simple xcodebuild command
        echo "🏗️ Building archive (attempt 1)..."
        
        # First, clean
        xcodebuild clean \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -quiet || echo "Clean may have warnings"
        
        # Build archive with automatic signing enabled
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App \
          -destination 'generic/platform=iOS' \
          -allowProvisioningUpdates \
          CODE_SIGN_STYLE="Automatic" \
          -quiet
        
        # 3. If that fails, try alternative method
        if [ ! -d "build/App.xcarchive" ]; then
          echo "⚠️ First attempt failed, trying manual method..."
          
          # Create a simple build script
          cat > build_app.sh << 'SCRIPT_EOF'
#!/bin/bash
set -e

# Enable automatic signing in project
/usr/libexec/PlistBuddy -c "Delete :objects:*:buildSettings:DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj 2>/dev/null || true
/usr/libexec/PlistBuddy -c "Add :objects:*:buildSettings:DEVELOPMENT_TEAM string $DEVELOPER_TEAM_ID" App.xcodeproj/project.pbxproj
/usr/libexec/PlistBuddy -c "Set :objects:*:buildSettings:CODE_SIGN_STYLE Automatic" App.xcodeproj/project.pbxproj
/usr/libexec/PlistBuddy -c "Set :objects:*:buildSettings:PROVISIONING_PROFILE_SPECIFIER ''" App.xcodeproj/project.pbxproj

# Build
xcodebuild archive \
  -workspace App.xcworkspace \
  -scheme App \
  -configuration Release \
  -archivePath build/App \
  -destination 'generic/platform=iOS' \
  -allowProvisioningUpdates \
  CODE_SIGN_STYLE="Automatic" \
  DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID"

# Export
xcodebuild -exportArchive \
  -archivePath build/App.xcarchive \
  -exportOptionsPlist exportOptions.plist \
  -exportPath build \
  -allowProvisioningUpdates
SCRIPT_EOF
          
          chmod +x build_app.sh
          ./build_app.sh
        fi
        
        # 4. If still failing, try with gym (fastlane)
        if [ ! -d "build/App.xcarchive" ]; then
          echo "⚠️ Second attempt failed, trying with fastlane..."
          
          # Install fastlane if not present
          gem install fastlane 2>/dev/null || true
          
          # Create a simple Fastfile
          mkdir -p fastlane
          cat > fastlane/Fastfile << 'FASTLANE_EOF'
default_platform(:ios)

platform :ios do
  desc "Build iOS app"
  lane :build do
    gym(
      workspace: "App.xcworkspace",
      scheme: "App",
      export_method: "app-store",
      output_directory: "build",
      output_name: "App.ipa",
      silent: true,
      clean: true
    )
  end
end
FASTLANE_EOF
          
          # Run fastlane
          fastlane ios build || echo "Fastlane may have warnings"
        fi
        
        # 5. Check for IPA in various locations
        echo "🔍 Looking for IPA file..."
        
        # Search for IPA
        IPA_FILE=""
        POSSIBLE_PATHS=(
          "build/App.ipa"
          "build/*.ipa"
          "*.ipa"
          "App.ipa"
        )
        
        for path in "${POSSIBLE_PATHS[@]}"; do
          if ls $path 1>/dev/null 2>&1; then
            IPA_FILE=$(ls $path | head -1)
            break
          fi
        done
        
        # 6. If no IPA found, create from .app file
        if [ -z "$IPA_FILE" ]; then
          echo "🔍 No IPA found, checking for .app file..."
          
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "📦 Creating IPA from .app file..."
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/
            zip -qr build/App.ipa Payload
            rm -rf Payload
            IPA_FILE="build/App.ipa"
            echo "✅ Created IPA from .app file"
          fi
        fi
        
        # 7. Final check
        if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
          echo "✅ IPA created successfully: $IPA_FILE"
          ls -lh "$IPA_FILE"
          
          # Ensure it's in the standard location
          if [ "$IPA_FILE" != "ios/App/build/App.ipa" ]; then
            mkdir -p build
            cp "$IPA_FILE" build/App.ipa
            echo "📦 Moved IPA to standard location: build/App.ipa"
            ls -lh build/App.ipa
          fi
        else
          echo "❌ IPA creation failed!"
          echo "📁 Current directory: $(pwd)"
          echo "📁 Contents:"
          ls -la
          echo "📁 Build folder:"
          ls -la build/ 2>/dev/null || echo "No build folder"
          exit 1
        fi